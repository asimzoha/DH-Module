
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emergency Services</title>

  <style>

    * {
      box-sizing: border-box;
    }

    .wrapper {
      max-width: 1024px;
      margin: 0 auto;
      font: 1.2em "Helvetica", "Arial", sans-serif;
    }

    .wrapper > * {
      border: 4px solid navy;
      background-color: skyblue;
      border-radius: 5px;
      padding: 10px;
    }

    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .main-head {
      grid-area: header;
    }

    .content {
      grid-area: content;
    }

    .main-nav {
      grid-area: nav;
    }

    .side {
      grid-area: sidebar;
    }

    .ad {
      grid-area: ad;
    }

    .main-footer {
      grid-area: footer;
    }

    .wrapper {
      display: grid;
      gap: 20px;

      grid-template-areas:
        "header"
        "nav"
        "content"
        "sidebar"
        "ad"
        "footer";
    }

    @media (width >= 500px) {

      .wrapper {
        grid-template-columns: 1fr 3fr;

        grid-template-areas:
          "header header"
          "nav nav"
          "sidebar content"
          "ad footer";
      }

      nav ul {
        display: flex;
        justify-content: space-between;
      }

    }

    @media (width >= 700px) {

      .wrapper {
        grid-template-columns: 1fr 4fr 1fr;

        grid-template-areas:
          "header header header"
          "nav content sidebar"
          "nav content ad"
          "footer footer footer";
      }

      nav ul {
        flex-direction: column;
      }

    }

  </style>
</head>

<body>

  <div class="wrapper">

    <header class="main-head">
      Emergency Services
    </header>

    <nav class="main-nav">
      <ul>
        <li>Patient's Name:</li>
        <li>Father's Name:</li>
        <li>Occupation:</li> 
        <li>Contact:</li>
      </ul>
    </nav>

    <article class="content">
      Presenting Complaints:
    </article>

    <aside class="side">
      Comorbidities:
    </aside>

    <div class="ad">
      Family History:
    </div>

    <footer class="main-footer">
      Treatment given in the hospital:
    </footer>

  </div>

</body>
</html>
